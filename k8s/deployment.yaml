apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-ledger-core
  labels:
    app: fintech-ledger-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fintech-ledger-core
  template:
    metadata:
      labels:
        app: fintech-ledger-core
    spec:
      containers:
        - name: ledger-core
          image: fintech-ledger-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
