apiVersion: v1
kind: Service
metadata:
  name: fintech-ledger-service
  labels:
    app: fintech-ledger-core
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: fintech-ledger-core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
data:
  PORT: "8080"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "ledger_db"
  REDIS_ADDR: "redis-service:6379"
